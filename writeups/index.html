---
layout: default
section: writeups
---

<h1>Writeups</h1>
<p class="lede">Vulnerability research and CTF challenge breakdowns.</p>

{% assign items = site.writeups | sort: "date" | reverse %}
{% for item in items %}
  <article class="excerpt log-entry">
    <div class="date">{{ item.date | date: "%Y-%m-%d" }}</div>
    <h3 class="unspaced"><a href="{{ item.url | relative_url }}">{{ item.title }}</a></h3>
    <p>{{ item.description }}</p>
  </article>
{% endfor %}
