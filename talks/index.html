---
layout: default
section: talks
---

<h1>Talks</h1>
<p class="lede">Slides, recordings, and conference presentations.</p>

{% assign items = site.talks | sort: "date" | reverse %}
{% for item in items %}
  <article class="excerpt log-entry">
    <div class="date">{{ item.date | date: "%Y-%m-%d" }}</div>
    <h3 class="unspaced"><a href="{{ item.url | relative_url }}">{{ item.title }}</a></h3>
    <p>{{ item.description }}</p>
  </article>
{% endfor %}
