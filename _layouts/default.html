<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    <div class="shell">
      {% include navbar.html %}

      <main id="main" class="page" tabindex="-1">
        {{ content }}
      </main>

      {% include footer.html %}
    </div>

    <script>
      (function () {
        var doc = document;
        var win = window;
        if (!doc || !win) return;

        var reduce = win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function runTypewriter(el, fullText, opts) {
          opts = opts || {};
          var speed = opts.speed !== undefined ? opts.speed : 32;
          var startDelay = opts.startDelay !== undefined ? opts.startDelay : 120;
          var onDone = opts.onDone;
          var onStart = opts.onStart;

          el._typewriterGen = (el._typewriterGen || 0) + 1;
          var myGen = el._typewriterGen;
          var i = 0;

          function tick() {
            if (myGen !== el._typewriterGen) return;
            i += 1;
            el.textContent = fullText.slice(0, i);
            if (i < fullText.length) {
              win.setTimeout(tick, speed);
            } else if (onDone) {
              onDone();
            }
          }

          el.textContent = '';
          if (onStart) onStart();
          win.setTimeout(tick, startDelay);
        }

        var targets = doc.querySelectorAll('.eyebrow, .command-label');
        if (!targets.length) return;

        function primeLabel(el) {
          var original = el.textContent.replace(/\s+/g, ' ').trim();
          if (!original) return false;
          el.dataset.text = original;
          el.classList.add('type-click-replay');
          el.setAttribute('title', 'Click to replay typing');
          return true;
        }

        function playLabel(el, instantStart) {
          if (!el.dataset.text || reduce) return;
          runTypewriter(el, el.dataset.text, {
            startDelay: instantStart ? 0 : 120,
            speed: 32,
            onStart: function () {
              el.classList.remove('typing-done', 'typing-pending');
              el.classList.add('typing-active');
            },
            onDone: function () {
              el.classList.remove('typing-active', 'typing-pending');
              el.classList.add('typing-done');
            }
          });
        }

        if (reduce) {
          targets.forEach(function (el) {
            if (!primeLabel(el)) return;
            el.textContent = el.dataset.text;
            el.classList.add('typing-done');
          });
          return;
        }

        if (!('IntersectionObserver' in win)) {
          targets.forEach(function (el) {
            if (!primeLabel(el)) return;
            el.textContent = el.dataset.text;
            el.classList.add('typing-done');
          });
        } else {
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              var el = entry.target;
              if (!entry.isIntersecting || el.dataset.playedScroll === '1') return;
              el.dataset.playedScroll = '1';
              playLabel(el, false);
              io.unobserve(el);
            });
          }, { threshold: 0.25, rootMargin: '0px 0px -8% 0px' });

          targets.forEach(function (el) {
            if (!primeLabel(el)) return;
            el.textContent = '';
            el.classList.add('typing-pending');
            io.observe(el);
          });
        }

        targets.forEach(function (el) {
          el.addEventListener('click', function () {
            playLabel(el, true);
          });
        });
      })();
    </script>
  </body>
</html>
