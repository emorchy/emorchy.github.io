---
layout: default
section: projects
---

<h1 class="pb-4">Projects</h1>

{% assign items = site.projects | sort: "date" | reverse %}
{% for item in items %}
  <article class="excerpt">
    <h3 class="unspaced"><a href="{{ item.url | relative_url }}">{{ item.title }}</a></h3>
    <div class="date">{{ item.date | date: "%-d %b %Y" }}</div>
    <p>{{ item.description }}</p>
  </article>
{% endfor %}
