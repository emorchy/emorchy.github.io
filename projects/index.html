---
layout: default
section: projects
---

<h1>Projects</h1>
<p class="lede">Engineering builds, tooling, and experiments.</p>

{% assign items = site.projects | sort: "date" | reverse %}
{% for item in items %}
  <article class="excerpt log-entry">
    <div class="date">{{ item.date | date: "%Y-%m-%d" }}</div>
    <h3 class="unspaced"><a href="{{ item.url | relative_url }}">{{ item.title }}</a></h3>
    <p>{{ item.description }}</p>
  </article>
{% endfor %}
